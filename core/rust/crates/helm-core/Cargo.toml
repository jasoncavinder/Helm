[package]
name = "helm-core"
version.workspace = true
edition = "2024"
license = "UNLICENSED"
description = "Helm core domain models and manager adapter contracts"

[dependencies]
quick-xml = "0.41"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse", "display"] }
tempfile = "3"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
# uv 0.12.18's matcher fixes prerelease bounds and zero-padded wildcard membership.
# This internal uv crate has no stable API; upgrades must be reviewed explicitly.
uv-pep440 = "=0.0.85"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
