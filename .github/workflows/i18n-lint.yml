name: i18n Lint

permissions:
  contents: read

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  hardcoded-ui-strings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure Locales Stay Synced
        run: |
          set -euo pipefail
          for locale in en es de fr pt-BR ja hu; do
            diff -ru "locales/$locale" "apps/macos-ui/Helm/Resources/locales/$locale"
          done

      - name: Validate Locale Key and Placeholder Integrity
        run: apps/macos-ui/scripts/check_locale_integrity.sh

      - name: Check Locale String Length Overflow
        run: apps/macos-ui/scripts/check_locale_lengths.sh

      - name: Test Locale Integrity Checker
        run: bash apps/macos-ui/scripts/test_locale_integrity.sh

      - name: Block Hardcoded UI Strings
        run: apps/macos-ui/scripts/check_hardcoded_ui_strings.sh
