name: Docs Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - '.github/pull_request_template.md'
      - '.github/workflows/docs-checks.yml'
  push:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - '.github/pull_request_template.md'
      - '.github/workflows/docs-checks.yml'

jobs:
  docs-checks:
    name: Docs Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate docs structure and merge-state cleanliness
        run: |
          set -euo pipefail

          required_files=(
            AGENTS.md
            CONTRIBUTING.md
            docs/PROJECT_BRIEF.md
            docs/CURRENT_STATE.md
            docs/NEXT_STEPS.md
            docs/ARCHITECTURE.md
            docs/DECISIONS.md
            docs/ROADMAP.md
            docs/RELEASE_CHECKLIST.md
            docs/VERSIONING.md
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required docs file: $file"
              exit 1
            fi
          done

          if rg -n "^(<<<<<<<|=======|>>>>>>>)" docs AGENTS.md README.md CONTRIBUTING.md .github/pull_request_template.md; then
            echo "::error::Found unresolved merge markers in docs scope."
            exit 1
          fi

          echo "Docs checks passed."
