name: Web Build

permissions:
  contents: read

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  push:
    branches: [dev, main]
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"

jobs:
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate guide content IDs
        run: npm run check:content-ids

      - name: Build website
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build
