name: Release Contract Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  release-contracts:
    name: Release Contract Checks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          ACTIONLINT_DIR="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$ACTIONLINT_DIR"
          GOBIN="$ACTIONLINT_DIR" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          echo "ACTIONLINT_BIN=$ACTIONLINT_DIR/actionlint" >> "$GITHUB_ENV"

      - name: Validate GitHub Actions workflows
        run: |
          "$ACTIONLINT_BIN"

      - name: Validate unsigned build script safety contracts
        run: scripts/release/tests/build_unsigned_variant_contract.sh

      - name: Validate release publish verify merge-order contracts
        run: scripts/release/tests/publish_verify_state_contract.sh

      - name: Validate prerelease publish verify merge-order contracts
        run: scripts/release/tests/publish_verify_prerelease_state_contract.sh

      - name: Validate prerelease GUI and CLI pair-state contracts
        run: scripts/release/tests/publish_verify_prerelease_pair_state_contract.sh

      - name: Validate publish PR handoff-state contracts
        run: scripts/release/tests/publish_pr_handoff_state_contract.sh

      - name: Validate release-worktree tagging contracts
        run: scripts/release/tests/runbook_release_worktree_tag_contract.sh

      - name: Validate GitHub release-state publication contracts
        run: scripts/release/tests/runbook_publish_release_state_contract.sh

      - name: Validate release-line copy drift contracts
        run: scripts/release/check_release_line_copy.sh

      - name: Validate CI toolchain pin contracts
        run: scripts/release/tests/ci_toolchain_contract.sh

      - name: Validate CI toolchain pin regression coverage
        run: scripts/release/tests/ci_toolchain_contract_regression.sh

      - name: Validate release workflow safety contracts
        run: scripts/release/tests/release_workflow_contract.sh

      - name: Validate privileged helper packaging contracts
        run: scripts/release/tests/privileged_helper_packaging_contract.sh

      - name: Validate Sparkle appcast channel contracts
        run: scripts/release/tests/sparkle_appcast_channels_contract.sh

      - name: Validate post-publication preflight contract
        run: scripts/release/tests/preflight_post_publish_contract.sh

      - name: Validate release provenance manifest contracts
        run: scripts/release/tests/provenance_manifest_contract.sh

      - name: Run release preflight contract (non-destructive)
        run: >
          scripts/release/preflight.sh
          --allow-non-main
          --allow-dirty
          --no-fetch
          --skip-secrets
          --skip-workflows
          --skip-ruleset-policy

      - name: Run release runbook contract (non-destructive prepare)
        run: >
          scripts/release/runbook.sh prepare
          --allow-non-main
          --allow-dirty
          --no-fetch
          --skip-secrets
          --skip-workflows
          --skip-ruleset-policy

      - name: Prepare release rehearsal source-version fixture
        env:
          REHEARSAL_TAG: v99.99.${{ github.run_id }}
        run: |
          set -euo pipefail
          REHEARSAL_FIXTURE="$RUNNER_TEMP/release-rehearsal-fixture"
          git worktree add --detach "$REHEARSAL_FIXTURE" HEAD
          python3 - "$REHEARSAL_FIXTURE/core/rust/Cargo.toml" "${REHEARSAL_TAG#v}" <<'PY'
          import pathlib
          import re
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          fixture_version = sys.argv[2]
          lines = manifest_path.read_text(encoding="utf-8").splitlines(keepends=True)
          in_workspace_package = False
          replacements = 0

          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("[") and stripped.endswith("]"):
                  in_workspace_package = stripped == "[workspace.package]"
                  continue
              if not in_workspace_package:
                  continue
              match = re.match(r'^(\s*version\s*=\s*")[^"]+(".*)$', line, flags=re.DOTALL)
              if match:
                  lines[index] = f"{match.group(1)}{fixture_version}{match.group(2)}"
                  replacements += 1
                  break

          if replacements != 1:
              raise SystemExit("unable to replace the rehearsal fixture workspace version")

          manifest_path.write_text("".join(lines), encoding="utf-8")
          PY
          echo "REHEARSAL_FIXTURE=$REHEARSAL_FIXTURE" >> "$GITHUB_ENV"

      - name: Run release rehearsal dry-run contract
        env:
          REHEARSAL_TAG: v99.99.${{ github.run_id }}
          REHEARSAL_REPORT_PATH: ${{ runner.temp }}/release-rehearsal-report.json
        run: >
          "${REHEARSAL_FIXTURE}/scripts/release/rehearsal_dry_run.sh"
          --tag "${REHEARSAL_TAG}"
          --report-path "${REHEARSAL_REPORT_PATH}"

      - name: Validate release rehearsal report contract
        env:
          REHEARSAL_REPORT_PATH: ${{ runner.temp }}/release-rehearsal-report.json
        run: |
          python3 - "$REHEARSAL_REPORT_PATH" <<'PY'
          import json
          import pathlib
          import sys

          report_path = pathlib.Path(sys.argv[1])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          assert report.get("schema") == "helm.release.rehearsal_report"
          assert report.get("schema_version") == 1
          assert report.get("dry_run") is True
          assert report.get("overall_status") == "passed"

          steps = report.get("steps") or []
          names = [step.get("name") for step in steps]
          assert names == ["preflight", "prepare", "verify"]
          for step in steps:
              assert step.get("status") == "passed"
              assert step.get("exit_code") == 0
          PY

      - name: Upload release rehearsal report artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-rehearsal-report
          path: ${{ runner.temp }}/release-rehearsal-report.json
          if-no-files-found: error
