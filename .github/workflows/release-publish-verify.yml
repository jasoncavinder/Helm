name: Release Publish Verify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional stable release tag to enforce (for example v0.17.6)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "web/public/updates/appcast.xml"
      - "web/public/updates/release-notes/**"
      - "web/public/updates/cli/latest.json"
      - "web/public/updates/cli/latest-rc.json"
      - ".github/workflows/release-publish-verify.yml"

permissions:
  contents: read

jobs:
  verify-release-publish-metadata:
    runs-on: ubuntu-latest
    env:
      EXPECTED_TAG: ${{ github.event.inputs.tag || '' }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify stable publish metadata maps to a stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APPCAST_FILE="web/public/updates/appcast.xml"
          STABLE_CLI_FILE="web/public/updates/cli/latest.json"

          if [ ! -f "$APPCAST_FILE" ]; then
            echo "::error::Missing appcast file: ${APPCAST_FILE}"
            exit 1
          fi
          if [ ! -f "$STABLE_CLI_FILE" ]; then
            echo "::error::Missing stable CLI metadata file: ${STABLE_CLI_FILE}"
            exit 1
          fi

          APPCAST_VERSION="$(
          APPCAST_FILE="$APPCAST_FILE" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          sparkle_ns = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          root = ET.parse(os.environ["APPCAST_FILE"]).getroot()
          item = None
          for candidate in root.findall("./channel/item"):
              channel = (candidate.findtext(f"{{{sparkle_ns}}}channel") or "").strip() or "default"
              if channel == "default":
                  item = candidate
                  break
          if item is None:
              print("")
              raise SystemExit(0)

          enclosure = item.find("enclosure")
          if enclosure is not None:
              version = enclosure.attrib.get(f"{{{sparkle_ns}}}shortVersionString", "").strip()
              if version:
                  print(version)
                  raise SystemExit(0)

          title = (item.findtext("title") or "").strip()
          if title.lower().startswith("helm "):
              print(title[5:].strip())
          else:
              print("")
          PY
          )"

          STABLE_CLI_VERSION="$(
          python3 - "$STABLE_CLI_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              payload = json.load(f)
          print(str(payload.get("version", "")).strip())
          PY
          )"

          STABLE_CLI_CHANNEL="$(
          python3 - "$STABLE_CLI_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              payload = json.load(f)
          print(str(payload.get("channel", "")).strip())
          PY
          )"

          if [ -z "$APPCAST_VERSION" ]; then
            echo "::error::Unable to parse default-channel appcast version from ${APPCAST_FILE}"
            exit 1
          fi
          if [ -z "$STABLE_CLI_VERSION" ]; then
            echo "::error::Unable to parse stable CLI version from ${STABLE_CLI_FILE}"
            exit 1
          fi
          if [ "$STABLE_CLI_CHANNEL" != "stable" ]; then
            echo "::error::Stable CLI metadata must declare channel=stable."
            echo "::error::actual channel=${STABLE_CLI_CHANNEL}"
            exit 1
          fi

          OPEN_PUBLISH_HEADS="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json headRefName --jq '.[].headRefName' || true)"
          STABLE_SYNC_STATE="$(
            scripts/release/publish_verify_state.sh \
              "$APPCAST_VERSION" \
              "$STABLE_CLI_VERSION" \
              "$OPEN_PUBLISH_HEADS"
          )"

          STABLE_SYNC_STATUS=""
          STABLE_SYNC_REASON=""
          STABLE_SYNC_TARGET_VERSION=""
          STABLE_SYNC_MATCHING_HEADS=""
          while IFS='=' read -r key value; do
            case "$key" in
              STATUS) STABLE_SYNC_STATUS="$value" ;;
              REASON) STABLE_SYNC_REASON="$value" ;;
              TARGET_VERSION) STABLE_SYNC_TARGET_VERSION="$value" ;;
              MATCHING_HEADS) STABLE_SYNC_MATCHING_HEADS="$value" ;;
            esac
          done <<< "$STABLE_SYNC_STATE"

          if [ "$STABLE_SYNC_STATUS" = "pending" ]; then
            echo "::notice::Stable metadata mismatch is pending publish PR merge."
            echo "::notice::appcast=${APPCAST_VERSION} cli_latest=${STABLE_CLI_VERSION} target=${STABLE_SYNC_TARGET_VERSION}"
            if [ -n "$STABLE_SYNC_MATCHING_HEADS" ]; then
              echo "::notice::open_publish_heads=${STABLE_SYNC_MATCHING_HEADS}"
            fi
            {
              echo "## Release Publish Verify"
              echo ""
              echo "- Stable metadata status: follow-up required (pending publish PR merge)"
              echo "- appcast version: ${APPCAST_VERSION}"
              echo "- stable CLI metadata version: ${STABLE_CLI_VERSION}"
              echo "- target version: ${STABLE_SYNC_TARGET_VERSION}"
              if [ -n "$STABLE_SYNC_MATCHING_HEADS" ]; then
                echo "- open publish branch(es): ${STABLE_SYNC_MATCHING_HEADS}"
              fi
              echo "- action: merge pending publish PR(s), then rerun this workflow"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$STABLE_SYNC_STATUS" = "invalid" ]; then
            echo "::error::Invalid stable metadata version state."
            echo "::error::reason=${STABLE_SYNC_REASON}"
            echo "::error::appcast=${APPCAST_VERSION} cli_latest=${STABLE_CLI_VERSION}"
            exit 1
          fi

          if [ "$STABLE_SYNC_STATUS" != "synced" ]; then
            echo "::error::Stable publish metadata mismatch."
            echo "::error::reason=${STABLE_SYNC_REASON}"
            echo "::error::appcast=${APPCAST_VERSION} cli_latest=${STABLE_CLI_VERSION}"
            exit 1
          fi

          STABLE_TAG="v${APPCAST_VERSION}"
          if [ -n "${EXPECTED_TAG}" ] && [ "${EXPECTED_TAG}" != "${STABLE_TAG}" ]; then
            echo "::error::Expected tag does not match stable metadata."
            echo "::error::expected=${EXPECTED_TAG} actual=${STABLE_TAG}"
            exit 1
          fi

          RELEASE_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${STABLE_TAG}" --jq '{tag_name, draft, prerelease}')"
          RELEASE_DRAFT="$(printf '%s' "$RELEASE_STATE" | python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("draft") else "false")')"
          RELEASE_PRERELEASE="$(printf '%s' "$RELEASE_STATE" | python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("prerelease") else "false")')"

          if [ "$RELEASE_DRAFT" = "true" ]; then
            echo "::error::Release ${STABLE_TAG} is still draft."
            exit 1
          fi
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            echo "::error::Release ${STABLE_TAG} must be stable (prerelease=false) for top appcast/latest metadata."
            exit 1
          fi

          RELEASE_NOTES_FILE="web/public/updates/release-notes/${STABLE_TAG}.html"
          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            echo "::error::Missing published release notes file for ${STABLE_TAG}: ${RELEASE_NOTES_FILE}"
            exit 1
          fi

          {
            echo "## Release Publish Verify"
            echo ""
            echo "- Stable metadata version: ${APPCAST_VERSION}"
            echo "- Stable metadata tag: ${STABLE_TAG}"
            echo "- Stable release notes file: ${RELEASE_NOTES_FILE}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "[verify] Stable publish metadata is consistent for ${STABLE_TAG}."

      - name: Verify prerelease GUI and CLI metadata map to a prerelease release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APPCAST_FILE="web/public/updates/appcast.xml"
          RC_CLI_FILE="web/public/updates/cli/latest-rc.json"
          APPCAST_BETA_VERSION="$(APPCAST_FILE="$APPCAST_FILE" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          sparkle_ns = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          root = ET.parse(os.environ["APPCAST_FILE"]).getroot()
          for item in root.findall("./channel/item"):
              channel = (item.findtext(f"{{{sparkle_ns}}}channel") or "").strip() or "default"
              if channel != "beta":
                  continue
              enclosure = item.find("enclosure")
              version = "" if enclosure is None else enclosure.attrib.get(
                  f"{{{sparkle_ns}}}shortVersionString", ""
              ).strip()
              print(version)
              break
          PY
          )"

          RC_CLI_VERSION=""
          RC_CLI_CHANNEL=""
          if [ -f "$RC_CLI_FILE" ]; then
            RC_CLI_VERSION="$(python3 - "$RC_CLI_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              payload = json.load(f)
          print(str(payload.get("version", "")).strip())
          PY
            )"
            RC_CLI_CHANNEL="$(python3 - "$RC_CLI_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              payload = json.load(f)
          print(str(payload.get("channel", "")).strip())
          PY
            )"
          fi

          if [ -f "$RC_CLI_FILE" ] && [ -z "$RC_CLI_VERSION" ]; then
            echo "::error::Unable to parse prerelease CLI version from ${RC_CLI_FILE}"
            exit 1
          fi
          if [ -n "$RC_CLI_VERSION" ] && [ "$RC_CLI_CHANNEL" != "rc" ]; then
            echo "::error::Prerelease CLI metadata must declare channel=rc."
            echo "::error::actual channel=${RC_CLI_CHANNEL}"
            exit 1
          fi

          OPEN_PUBLISH_HEADS="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json headRefName --jq '.[].headRefName' || true)"
          PAIR_STATE="$(
            scripts/release/publish_verify_prerelease_pair_state.sh \
              "$APPCAST_BETA_VERSION" \
              "$RC_CLI_VERSION" \
              "$OPEN_PUBLISH_HEADS"
          )"
          PAIR_STATUS="$(printf '%s\n' "$PAIR_STATE" | awk -F= '$1=="STATUS" {print substr($0, index($0, "=") + 1)}')"
          PAIR_REASON="$(printf '%s\n' "$PAIR_STATE" | awk -F= '$1=="REASON" {print substr($0, index($0, "=") + 1)}')"
          RC_VERSION="$(printf '%s\n' "$PAIR_STATE" | awk -F= '$1=="TARGET_VERSION" {print substr($0, index($0, "=") + 1)}')"
          MATCHING_HEADS="$(printf '%s\n' "$PAIR_STATE" | awk -F= '$1=="MATCHING_HEADS" {print substr($0, index($0, "=") + 1)}')"

          case "$PAIR_STATUS" in
            empty)
              echo "[verify] No prerelease GUI or CLI metadata found; skipping prerelease verification."
              exit 0
              ;;
            synced)
              ;;
            pending)
              echo "::notice::Prerelease GUI/CLI gap is pending the exact counterpart publish PR merge."
              echo "::notice::appcast_beta=${APPCAST_BETA_VERSION:-<missing>} cli_latest_rc=${RC_CLI_VERSION:-<missing>} heads=${MATCHING_HEADS}"
              {
                echo "- Prerelease metadata status: follow-up required (pending exact counterpart publish PR)"
                echo "- GUI beta-channel version: ${APPCAST_BETA_VERSION:-<missing>}"
                echo "- RC CLI metadata version: ${RC_CLI_VERSION:-<missing>}"
                echo "- Matching publish PR branch: ${MATCHING_HEADS}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            invalid|incomplete|mismatch)
              echo "::error::Prerelease GUI and CLI metadata are not coherent: ${PAIR_REASON}"
              echo "::error::appcast_beta=${APPCAST_BETA_VERSION:-<missing>} cli_latest_rc=${RC_CLI_VERSION:-<missing>}"
              exit 1
              ;;
            *)
              echo "::error::Unexpected prerelease pair state: ${PAIR_STATUS:-<empty>}"
              exit 1
              ;;
          esac

          RC_TAG="v${RC_VERSION}"
          RC_RELEASE_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RC_TAG}" --jq '{tag_name, draft, prerelease}')"
          RC_RELEASE_DRAFT="$(printf '%s' "$RC_RELEASE_STATE" | python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("draft") else "false")')"
          RC_RELEASE_PRERELEASE="$(printf '%s' "$RC_RELEASE_STATE" | python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("prerelease") else "false")')"

          if [ "$RC_RELEASE_DRAFT" = "true" ]; then
            echo "::error::Prerelease tag ${RC_TAG} is still draft."
            exit 1
          fi
          if [ "$RC_RELEASE_PRERELEASE" != "true" ]; then
            echo "::error::RC metadata points at ${RC_TAG}, but that release is not marked prerelease=true."
            exit 1
          fi

          {
            if [ -n "$APPCAST_BETA_VERSION" ]; then
              echo "- GUI beta-channel version: ${APPCAST_BETA_VERSION}"
            fi
            if [ -n "$RC_CLI_VERSION" ]; then
              echo "- RC CLI metadata version: ${RC_CLI_VERSION}"
            fi
            echo "- RC metadata tag: ${RC_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "[verify] Prerelease publish metadata is consistent for ${RC_TAG}."
