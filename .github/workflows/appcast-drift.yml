name: Appcast Drift Guard

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - "web/public/updates/appcast.xml"
      - ".github/workflows/release-macos-dmg.yml"
      - ".github/workflows/appcast-drift.yml"

jobs:
  verify-appcast-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare latest stable release with appcast default channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FEED_PATH="web/public/updates/appcast.xml"
          if [ ! -f "$FEED_PATH" ]; then
            echo "::error::Missing appcast file: $FEED_PATH"
            exit 1
          fi

          LATEST_STABLE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select((.draft|not) and (.prerelease|not))][0].tag_name')"
          if [ -z "$LATEST_STABLE_TAG" ] || [ "$LATEST_STABLE_TAG" = "null" ]; then
            echo "::error::Unable to determine latest stable release tag from GitHub releases."
            exit 1
          fi
          EXPECTED_VERSION="${LATEST_STABLE_TAG#v}"

          APPCAST_VERSION="$(FEED_PATH="$FEED_PATH" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          sparkle_ns = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          root = ET.parse(os.environ["FEED_PATH"]).getroot()
          item = None
          for candidate in root.findall("./channel/item"):
              channel = (candidate.findtext(f"{{{sparkle_ns}}}channel") or "").strip() or "default"
              if channel == "default":
                  item = candidate
                  break
          enclosure = item.find("enclosure") if item is not None else None
          version = enclosure.attrib.get(f"{{{sparkle_ns}}}shortVersionString", "").strip() if enclosure is not None else ""
          title = (item.findtext("title") or "").strip() if item is not None else ""
          print(version or (title[5:].strip() if title.lower().startswith("helm ") else ""))
          PY
          )"

          if [ -z "$APPCAST_VERSION" ]; then
            echo "::error::Unable to parse default-channel appcast version from ${FEED_PATH}"
            exit 1
          fi

          echo "Latest stable tag: ${LATEST_STABLE_TAG}"
          echo "Appcast default-channel version: ${APPCAST_VERSION}"

          if [ "$APPCAST_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Appcast drift detected: latest stable is ${EXPECTED_VERSION}, but appcast advertises ${APPCAST_VERSION}."
            echo "::error::Update ${FEED_PATH} via the release-publish workflow fallback branch/PR."
            exit 1
          fi

          echo "Appcast version matches latest stable release (${EXPECTED_VERSION})."
