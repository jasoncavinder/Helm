name: CI Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  rust-tests:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guardrail - ensure legacy GitHub Pages workflow is absent
        run: |
          set -euo pipefail
          if [ -f ".github/workflows/deploy-web.yml" ]; then
            echo "error: .github/workflows/deploy-web.yml must not be reintroduced; website hosting is Cloudflare Pages." >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run SQLite migration compatibility gate
        working-directory: .
        run: scripts/ci/check_sqlite_migration_compatibility.sh

      - name: Run cargo test
        run: cargo test --workspace

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --workspace -- -D warnings

  xcode-build:
    name: Xcode Build Check
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Validate channel policy rendering
        run: |
          set -euo pipefail
          apps/macos-ui/scripts/check_channel_policy.sh

      - name: Build and test Xcode project
        run: |
          set -euo pipefail
          XCODE_DESTINATION="$(apps/macos-ui/scripts/macos_xcode_destination.sh)"
          xcodebuild \
            -project apps/macos-ui/Helm.xcodeproj \
            -scheme Helm \
            -destination "$XCODE_DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test
