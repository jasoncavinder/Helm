name: Rustls Lockfile Security Update

on:
  push:
    branches:
      - security/rustls-0.23.45

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update rustls lockfile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1

      - name: Update rustls to patched release
        run: cargo update -p rustls --precise 0.23.45

      - name: Verify patched lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lockfile = Path("Cargo.lock").read_text()
          match = re.search(r'\[\[package\]\]\nname = "rustls"\nversion = "([^"]+)"', lockfile)
          if match is None:
              raise SystemExit("rustls is missing from Cargo.lock")
          if match.group(1) != "0.23.45":
              raise SystemExit(f"expected rustls 0.23.45, found {match.group(1)}")
          PY
          cargo check --workspace --locked

      - name: Commit generated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/rust/Cargo.lock
          git diff --cached --quiet && { echo "Cargo.lock did not change"; exit 1; }
          git commit -m "fix(deps): update rustls to 0.23.45"
          git push origin HEAD:${GITHUB_REF_NAME}
